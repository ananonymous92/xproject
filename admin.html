<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin Panel — PPF Website</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0a0b;--card:#16171a;--line:rgba(255,255,255,.08);--gold:#ff4444;--muted:#9a9ba1}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,sans-serif;background:var(--bg);color:#eee;min-height:100vh}
    h1,h2,button{font-family:Outfit,sans-serif}
    .login{display:grid;place-items:center;min-height:100vh}
    .login form{background:var(--card);padding:40px;border-radius:18px;border:1px solid var(--line);width:min(360px,90%);display:flex;flex-direction:column;gap:14px}
    input,textarea,select{width:100%;background:#0f1012;border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:#fff;font:inherit}
    input:focus,textarea:focus{outline:none;border-color:var(--gold)}
    button{cursor:pointer;border:none;border-radius:999px;padding:11px 22px;font-weight:600}
    .gold{background:linear-gradient(135deg,#ff7777,#ff4444);color:#111}
    .ghost{background:transparent;border:1px solid var(--line);color:#ddd}
    .danger{background:#3a1616;color:#ff9b9b}
    .app{display:none;grid-template-columns:230px 1fr;min-height:100vh}
    aside{background:#0f1012;border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh}
    aside h1{font-size:1.1rem;margin-bottom:24px;color:var(--gold);letter-spacing:2px}
    aside a{display:block;padding:10px 14px;border-radius:10px;color:#bbb;cursor:pointer;margin-bottom:4px}
    aside a.on,aside a:hover{background:var(--card);color:#fff}
    main{padding:32px clamp(16px,4vw,48px);max-width:1000px}
    .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
    .bar div{display:flex;gap:8px;flex-wrap:wrap}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
    .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
    .item-head{display:flex;justify-content:space-between;margin-bottom:12px;color:var(--gold);font-weight:600}
    .preview{max-height:110px;border-radius:8px;margin-top:8px}
    .row{display:flex;gap:8px}
    .toast{position:fixed;bottom:24px;right:24px;background:var(--gold);color:#111;padding:12px 20px;border-radius:10px;opacity:0;transition:.3s;font-weight:600}
    .toast.show{opacity:1}
    @media(max-width:760px){.app{grid-template-columns:1fr}aside{height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px}aside h1{width:100%;margin-bottom:8px}}
  </style>
</head>
<body>
  <div class="login" id="login">
    <form id="loginForm">
      <h2>Admin Panel</h2>
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" maxlength="200" required>
      <button class="gold">Masuk</button>
    </form>
  </div>

  <div class="app" id="app">
    <aside id="tabs"><h1>ADMIN</h1></aside>
    <main>
      <div class="bar">
        <h2 id="tabTitle"></h2>
        <div>
          <a href="index.html" target="_blank"><button class="ghost" type="button">Lihat Website</button></a>
          <button class="ghost" id="logoutBtn" type="button">Logout</button>
          <button class="danger" id="resetBtn">Reset Default</button>
          <button class="gold" id="saveBtn">Simpan Perubahan</button>
        </div>
      </div>
      <div id="editor"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script src="js/data.js?v=6"></script>
  <script src="js/admin.js?v=10"></script>
</body>
</html>
